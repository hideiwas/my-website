<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIL 4 MSF 模擬試験 : EXAM MSF4 (完全版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-3 md:p-6">

    <!-- シャッフル確認モーダル -->
    <div id="shuffle-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden slide-up">
            <div class="bg-amber-500 p-4 text-center">
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mx-auto text-amber-500 text-2xl font-bold mb-2">🔀</div>
                <h3 class="text-white text-lg font-bold">ランダム出題を開始しますか？</h3>
            </div>
            <div class="p-6">
                <p class="text-slate-600 text-sm mb-6 text-center leading-relaxed">
                    現在の解答状況やスコアは<span class="font-bold text-rose-500">すべてリセット</span>され、第1問から新しい順番で再スタートします。
                </p>
                <div class="flex gap-3">
                    <button id="cancel-shuffle-btn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl transition">キャンセル</button>
                    <button id="confirm-shuffle-btn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition shadow-lg shadow-amber-500/30">シャッフル開始</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="bg-white rounded-2xl shadow-xl w-full max-w-4xl overflow-hidden border border-slate-200 flex flex-col">
        <!-- Header (Teal Theme for MSF) -->
        <div class="bg-teal-700 text-white px-6 py-5 flex flex-col md:flex-row justify-between items-start md:items-center shadow-md gap-4">
            <div>
                <span class="text-xs font-semibold tracking-wider uppercase text-teal-200 block">ITIL 4 Specialist : Monitor, Support and Fulfil</span>
                <h1 class="text-lg md:text-xl font-bold">MSF 模擬試験 : EXAM MSF4</h1>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div class="flex items-center gap-2 bg-teal-800/80 px-3 py-1.5 rounded-lg border border-teal-400/30">
                    <span class="text-xs text-teal-200 font-medium">ジャンプ:</span>
                    <select id="question-jump" class="bg-transparent text-white text-sm font-bold focus:outline-none cursor-pointer">
                        <!-- Options will be generated -->
                    </select>
                </div>
                <span id="progress-text" class="text-sm font-semibold bg-teal-800/80 px-3 py-1.5 rounded-lg border border-teal-400/30 whitespace-nowrap"></span>
                <button id="shuffle-btn" class="flex-1 md:flex-none bg-amber-500 hover:bg-amber-400 text-white text-sm font-bold py-1.5 px-3 rounded-lg shadow transition flex items-center justify-center gap-1 border border-amber-400">
                    <span>🔀 ランダム</span>
                </button>
                <button id="play-audio-btn" class="flex-1 md:flex-none bg-emerald-500 hover:bg-emerald-400 text-white text-sm font-bold py-1.5 px-3 rounded-lg shadow transition flex items-center justify-center gap-1 border border-emerald-400">
                    <span>▶️ 音声学習</span>
                </button>
                <button id="stop-audio-btn" class="hidden flex-1 md:flex-none bg-rose-500 hover:bg-rose-400 text-white text-sm font-bold py-1.5 px-3 rounded-lg shadow transition flex items-center justify-center gap-1 border border-rose-400">
                    <span>⏹️ 停止</span>
                </button>
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress-bar" class="bg-teal-500 h-2 transition-all duration-300"></div>
        </div>

        <!-- 音声再生中のステータス表示 -->
        <div id="audio-status" class="hidden bg-teal-50 text-teal-800 text-sm font-bold px-4 py-2 border-b border-teal-200 text-center animate-pulse">
            🔊 現在、自動音声読み上げモードで再生中です...
        </div>

        <!-- Question Area -->
        <div id="quiz-container" class="p-6 md:p-8 flex-1">
            <div class="flex items-center gap-2 mb-3">
                <span id="question-badge" class="bg-teal-100 text-teal-800 text-xs font-bold px-2.5 py-1 rounded">問題</span>
            </div>
            <h2 id="question-text" class="text-base md:text-lg font-semibold mb-6 leading-relaxed text-slate-900"></h2>
            
            <div id="options-container" class="space-y-3">
                <!-- Options will be injected here -->
            </div>

            <!-- Enhanced Explanation Area -->
            <div id="explanation-box" class="hidden mt-8 p-5 md:p-6 bg-slate-50 border-l-4 border-teal-600 rounded-r-xl border border-slate-200 slide-up shadow-sm">
                <div class="flex items-center gap-2 mb-3">
                    <span class="bg-teal-600 text-white text-xs font-bold px-2 py-0.5 rounded">シラバス準拠 解説</span>
                </div>
                <div id="explanation-content" class="text-sm leading-relaxed text-slate-700 space-y-3">
                    <!-- Dynamic explanation blocks -->
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="mt-8 pt-5 border-t border-slate-200 flex flex-col-reverse sm:flex-row justify-between items-center gap-4">
                <button id="prev-btn" class="hidden text-slate-500 hover:text-teal-600 font-bold py-2 px-4 rounded transition flex items-center gap-2">
                    <span class="text-xl leading-none">&larr;</span> 前の問題に戻る
                </button>
                <button id="next-btn" class="hidden w-full sm:w-auto bg-teal-600 hover:bg-teal-700 active:scale-95 text-white font-bold py-2.5 px-8 rounded-lg shadow transition duration-150 ml-auto">
                    次の問題へ進む
                </button>
            </div>
        </div>
        
        <!-- Result Screen -->
        <div id="result-container" class="hidden p-8 md:p-12 text-center my-auto">
            <div class="w-16 h-16 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">✓</div>
            <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-2">演習完了</h2>
            <p class="text-slate-600 mb-6">全68問の回答と解説の確認が完了しました。</p>
            <div class="bg-slate-50 p-6 rounded-xl max-w-xs mx-auto border border-slate-200 mb-8">
                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider mb-1">正答率</div>
                <div class="text-4xl font-extrabold text-teal-600"><span id="score"></span> <span id="total-score" class="text-xl text-slate-400 font-normal"></span></div>
            </div>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="location.reload()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition text-sm">最初からやり直す</button>
                <button id="result-shuffle-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition text-sm flex items-center justify-center gap-2">
                    🔀 ランダム順で再挑戦
                </button>
            </div>
        </div>
    </div>

    <script>
        const originalQuestions = [
            {
                question: "ユーザーにとって適切な言語やフォーマットを使用することでサポートされる、コミュニケーション・チャネルの特徴はどれですか？",
                options: [
                    "アクセシビリティ（利用しやすさ）",
                    "統合性（Integration）",
                    "保証（Assurance）",
                    "可用性（Availability）"

                answer: 0,
                syllabus: "2. サービスデスク (SD: 2.2.1, 表2.2)",
                rationale: "コミュニケーション・チャネルはアクセス可能（Accessible）であるべきです。この「アクセシビリティ」には、適切な言語、フォーマット、および視覚障害やその他の障害を持つユーザーのための特別な機能が含まれます。",

            },
            {

                    "プロアクティブな問題特定",
                    "リアクティブな問題特定"
                ],
                answer: 0,
                syllabus: "5. 問題管理 (PRM: 3.1.3, 表3.6)",

                tips: "問題の根本的な解決策やワークアラウンドは『エラー制御』ですが、調査の過程で得られる「インシデントの解決策」は『問題制御』のアウトプットです。"
            },
            {
                question: "あるサービスプロバイダは、「モニタリングおよびイベント管理」を自社のバリューストリームに統合することを計画しています。これらのバリューストリームの成功を確実にするために、サービスプロバイダが監視すべき最も重要な2つの事柄は何ですか？\n\n1. サービスが合意通りに提供されていること\n2. 人々が合意通りに行動していること\n3. サプライヤとの契約が合意通りに履行されていること\n4. 組織内で価値が共創（創造）されていること",

                ],

                syllabus: "4. モニタリングおよびイベント管理 (MEM: 3.2.2)",

                tips: "バリューストリームにおける監視の3つの観点＝①コンポーネントの最適な動作、②「合意通りのサービス提供（1）」、③「組織内での価値の創造（4）」です。"
            },
            {
                question: "「ユーザーへの伝達（communicating to users）」プロセスのどの活動において、ユーザーからの応答（返信）を必要とするコミュニケーションがサービスデスク・エージェントによって開始されますか？",
                options: [

                    "情報の送信（Information sending）",

                    "サービス消費者の視点からインシデントを見ることによって",

            },

                tips: "超重要！インシデント解決バリューストリームで『問題管理』が関与するステップは「診断」「解決」「クローズ」の後半3つだけです（前半の「検知」「登録」「分類」には関与しません）。"
            },
            {

                options: [

                    "コミュニケーションの障壁の増加",

                ],
                answer: 3,
                syllabus: "2. サービスデスク (SD: 4.2.1.4)",
                rationale: "仮想サービスデスクの主な利点は、①チームへのプレッシャーの軽減、および②「物理的なサービスデスク拠点（オフィススペース）への依存度を減らす（または完全に排除する）ことによる大幅なコスト削減」です。",
                tips: "仮想サービスデスクのメリット＝「物理的なオフィススペースへの依存低下（拠点コストの削減）」と「技術的バリアによるチームへの過度なプレッシャー軽減」です。"
            },
            {
                question: "インシデント管理を含む「タスクの優先度付け」に関するガイドラインではないものはどれですか？",
                options: [
                    "効果的な優先度付けのために、カンバンなどのツールを使用してタスクをグループ化し可視化すべきである",
                    "各チームは、インシデント用のバックログとその他のタスク用のバックログを別々に持つべきである",
                    "仕掛作業（WIP）の制限などのリーンの原則を適用することは、優先度付けに役立つ",
                    "優先度付けは、リソースの競合がある場合にのみ必要となる"
                ],
                answer: 1,
                syllabus: "1. インシデント管理 (INM: 2.4.2.1)",
                rationale: "優先度付けのガイドラインでは、「各チームにおいて、インシデントを含むすべての種類のタスク（計画された作業と計画外の作業の両方）は、別々ではなく『単一のバックログ（a single backlog）』内で優先度付けと割り当てを待つべきである」と定められています。",
                tips: "ひっかけ頻出！インシデントと通常タスクのバックログを「別々に分ける」のは誤りです。同じチームの同じリソースが対応するため、「単一のバックログ」で一元管理します。"
            },
            {
                question: "あるサービスプロバイダがサービス要求管理プラクティスのパフォーマンスを分析したところ、プロバイダのチームが実現する要求は合意基準を満たし満足度も高い一方、ユーザーが一部を実現することになっている要求は期限遅れが多く、ユーザーの不満につながっており、プロバイダ側が介入して完了させるケースが多いことが分かりました。同時に、新しいITSMソフトウェアシステムへの移行を計画しています。新しいシステムがこの状況に確実に対処できるようにするために、サービス要求管理の自動化要件として特に重要なものはどれですか？",
                options: [
                    "エンドツーエンドのバリューストリームのサポート",

                    "サービス要求モデルのサポート",
                    "利用可能で便利なセルフサービス"
                ],
                answer: 3,
                syllabus: "3. サービス要求管理 (SRM: 5.2.1)",
                rationale: "ユーザー自身が一部または全部を実現するサービス要求で遅延や不満が生じている場合、システムの「セルフヘルプ（セルフサービス）機能が利用可能で便利であること（ユーザー向けのインターフェースが明確で、使いやすく、有益であること）」を確保することが特に重要です。",
                tips: "「ユーザーが一部を行う要求で遅延や不満が出ている」場合のツール自動化要件＝『利用可能で便利なセルフサービス（明確で使いやすいUI）』です。"
            },
            {
                question: "あるサービスプロバイダは、イベントの相関分析とインパクト評価を改善するために人工知能（AI）の機能を実験しています。過去のモニタリングおよびイベント管理のレコードは、AIを学習させるのに十分なデータを提供していますが、いくつかの人間のインプットが必要です。相関分析とインパクト分析のどの側面に、サービスプロバイダのチームメンバーからのインプットが最も必要になる可能性が高いですか？",
                options: [
                    "システムパフォーマンスに対するイベントのインパクト",
                    "人間には明らかではない異常（アノマリー）",
                    "サービスおよびビジネスコンテキストに対するイベントのインパクト",
                    "パフォーマンスとキャパシティのしきい値"
                ],
                answer: 3,
                syllabus: "4. モニタリングおよびイベント管理 (MEM: 5.2.1)",
                rationale: "公式ガイド（5.2.1）の解説では、AIがイベントの重要度を理解する上での有効性は、データのみからは導き出せない「特定のサービスおよびビジネスコンテキストにおけるイベントの固有のインパクト」に関する人間からのインプット（教育）に大きく依存すると説明されています（※なお、本問題集の元データでは「パフォーマンスとキャパシティのしきい値」が正解キーとしてマークされているため、本アプリでもそちらを正解判定としていますが、両方の選択肢をセットで押さえておきましょう）。",
                tips: "※重要チェック：元問題集の解答キーに従い「パフォーマンスとキャパシティのしきい値」を正解としていますが、公式テキストおよび解説文の記述上は「サービスおよびビジネスコンテキストに対するイベントのインパクト」が人間のインプットを要する核心部分です。念のため両方確認しておきましょう！"
            }
        ];

        let questions = [...originalQuestions];
        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let shuffledOptionIndices = [];
        
        let isPlaying = false;
        let utterance = new SpeechSynthesisUtterance();
        utterance.lang = 'ja-JP';

        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const expBox = document.getElementById('explanation-box');
        const expContent = document.getElementById('explanation-content');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const progText = document.getElementById('progress-text');
        const progBar = document.getElementById('progress-bar');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const qBadge = document.getElementById('question-badge');
        
        const playBtn = document.getElementById('play-audio-btn');
        const stopBtn = document.getElementById('stop-audio-btn');
        const audioStatus = document.getElementById('audio-status');
        const jumpSelect = document.getElementById('question-jump');
        
        const shuffleBtn = document.getElementById('shuffle-btn');
        const shuffleModal = document.getElementById('shuffle-modal');
        const cancelShuffleBtn = document.getElementById('cancel-shuffle-btn');
        const confirmShuffleBtn = document.getElementById('confirm-shuffle-btn');
        const resultShuffleBtn = document.getElementById('result-shuffle-btn');

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareQuestions() {
            shuffledOptionIndices = [];
            for(let i=0; i<questions.length; i++) {
                const indices = [0, 1, 2, 3];
                const shuffled = shuffleArray(indices);
                shuffledOptionIndices.push(shuffled);
            }
        }

        function initJumpMenu() {
            jumpSelect.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.text = `問 ${i + 1}`;
                option.className = 'text-slate-800';
                jumpSelect.appendChild(option);
            }
            jumpSelect.addEventListener('change', (e) => {
                if (isPlaying) stopAudio();
                currentQuestion = parseInt(e.target.value);
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            qBadge.innerText = `問 ${currentQuestion + 1} / ${questions.length}`;
            qText.innerHTML = q.question.replace(/\n/g, '<br>');
            
            progText.innerText = `${currentQuestion + 1} / ${questions.length}`;
            progBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            jumpSelect.value = currentQuestion;

            if (currentQuestion === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            if (userAnswers[currentQuestion] !== null) {
                showAnswerState(userAnswers[currentQuestion]);
            } else {
                optionsContainer.innerHTML = '';
                expBox.classList.add('hidden');
                nextBtn.classList.add('hidden'); 

                const currentShuffledIndices = shuffledOptionIndices[currentQuestion];

                currentShuffledIndices.forEach((originalIndex, displayIndex) => {
                    const opt = q.options[originalIndex];
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-teal-400 focus:outline-none transition-all duration-150 bg-white font-medium text-slate-700 shadow-sm hover:bg-slate-50 flex items-start gap-3';
                    btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + displayIndex)}</span> <span>${opt}</span>`;
                    btn.onclick = () => {
                        if (isPlaying) stopAudio();
                        selectOption(originalIndex, btn);
                    };
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function selectOption(originalIndex) {
            userAnswers[currentQuestion] = originalIndex;
            if (originalIndex === questions[currentQuestion].answer) {
                score++;
            }
            showAnswerState(originalIndex);
        }

        function showAnswerState(selectedIndex) {
            const q = questions[currentQuestion];
            optionsContainer.innerHTML = '';
            
            const currentShuffledIndices = shuffledOptionIndices[currentQuestion];

            currentShuffledIndices.forEach((originalIndex, displayIndex) => {
                const opt = q.options[originalIndex];
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 transition-all duration-150 font-medium flex items-start gap-3';
                btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + displayIndex)}</span> <span>${opt}</span>`;
                btn.disabled = true; 
                
                if (originalIndex === q.answer) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-200');
                } else if (originalIndex === selectedIndex && originalIndex !== q.answer) {
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                } else {
                    btn.classList.add('border-slate-200', 'text-slate-700', 'opacity-60');
                }
                optionsContainer.appendChild(btn);
            });

            expContent.innerHTML = `
                <div class="bg-teal-50/80 p-3 rounded-lg border border-teal-100 text-teal-900 text-xs font-medium">
                    <span class="font-bold">📘 対象シラバス：</span> ${q.syllabus}
                </div>
                <div>
                    <h4 class="font-bold text-slate-900 text-sm mb-1">【正解の根拠と背景】</h4>
                    <p>${q.rationale}</p>
                </div>
                <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 text-amber-900 text-xs">
                    <span class="font-bold text-amber-800">💡 試験対策・着眼点：</span> ${q.tips}
                </div>
            `;
            expBox.classList.remove('hidden');
            
            nextBtn.classList.remove('hidden');
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "結果を見る";
            } else {
                nextBtn.innerText = "次の問題へ進む";
            }

            if(!isPlaying) {
                setTimeout(() => {
                    expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 80);
            }
        }

        nextBtn.onclick = () => {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                quizContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                document.getElementById('score').innerText = score;
                document.getElementById('total-score').innerText = `/ ${questions.length}`;
            }
        };

        prevBtn.onclick = () => {
            if (currentQuestion > 0) {
                if (isPlaying) stopAudio();
                currentQuestion--;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        // 音声自動再生
        playBtn.onclick = () => {
            if (isPlaying) return;
            isPlaying = true;
            playBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            audioStatus.innerText = "🔊 現在、自動音声読み上げモードで再生中です...";
            audioStatus.classList.remove('hidden');
            
            if (userAnswers[currentQuestion] === null) {
                 selectOption(questions[currentQuestion].answer); 
            }
            readCurrentQuestion();
        };

        stopBtn.onclick = stopAudio;

        function stopAudio() {
            isPlaying = false;
            window.speechSynthesis.cancel();
            stopBtn.classList.add('hidden');
            playBtn.classList.remove('hidden');
            audioStatus.classList.add('hidden');
        }

        function readCurrentQuestion() {
            if (!isPlaying) return;
            window.speechSynthesis.cancel();
            const q = questions[currentQuestion];
            let textToRead = `第${currentQuestion + 1}問。問題。。。${q.question}。。。。`;
            textToRead += `正解は。。。${q.options[q.answer]}。。。。`;
            textToRead += `解説。。。${q.rationale}。。。。`;
            textToRead += `試験対策のポイント。。。${q.tips}`;
            
            utterance.text = textToRead;
            
            utterance.onend = () => {
                if (isPlaying) {
                    if (currentQuestion < questions.length - 1) {
                        currentQuestion++;
                        loadQuestion();
                        if (userAnswers[currentQuestion] === null) {
                             selectOption(questions[currentQuestion].answer); 
                        }
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(readCurrentQuestion, 1500); 
                    } else {
                        isPlaying = false;
                        stopBtn.classList.add('hidden');
                        playBtn.classList.remove('hidden');
                        audioStatus.innerText = "✅ すべての問題の読み上げが完了しました。お疲れ様でした！";
                    }
                }
            };
            
            utterance.onerror = (e) => {
                console.error("音声読み上げエラー", e);
                if(isPlaying) stopAudio();
            };
            
            window.speechSynthesis.speak(utterance);
        }

        // シャッフル機能
        shuffleBtn.onclick = () => {
            if (isPlaying) stopAudio();
            shuffleModal.classList.remove('hidden');
        };
        
        cancelShuffleBtn.onclick = () => {
            shuffleModal.classList.add('hidden');
        };

        function executeShuffle() {
            questions = shuffleArray([...originalQuestions]);
            currentQuestion = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            
            prepareQuestions();
            initJumpMenu();
            loadQuestion();
            
            shuffleModal.classList.add('hidden');
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        confirmShuffleBtn.onclick = executeShuffle;
        resultShuffleBtn.onclick = executeShuffle;

        // 初期化処理
        prepareQuestions();
        initJumpMenu();
        loadQuestion();
    </script>
</body>
</html>
