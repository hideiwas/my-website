                syllabus: "第3章：情報と技術（3.9.1 統合されたツールセットの価値）",
                rationale: "ITSMツールセット（統合されたサービス管理ツールセット）は、大量の作業をリアルタイムに管理・ルーティングし、パフォーマンスやコストのレポートを提供するだけでなく、すべての作業提供の監査証跡（監査証跡）を残し、サービス資産を管理する機能を提供します。",
                tips: "「作業の監査（Audit trails）」「サービス資産の管理」「レポート提供」は統合されたITSMツールのコア機能です。"
            },
            {
                question: "ある組織が、異なる国にいるが「勤務時間が類似（同じ時間帯）」しているサプライヤからサービスを獲得したいと考えている。どのソーシングモデルを使用すべきか。",
                options: [
                    "オフショアリング",
                    "オンショアリング",
                    "インソーシング",
                    "ニアショアリング"
                ],
                answer: 3,
                syllabus: "第5章：ソーシング戦略（5.2.2 ロケーションベースのソーシング）",
                rationale: "「異なる国」であるが、「勤務時間が類似している（＝時差が少ない近隣国）」ベンダーへのアウトソーシングは『ニアショアリング』と呼ばれます。リアルタイムの連携が可能になります。",
                tips: "国内＝オンショアリング。近隣国（時差なし）＝ニアショアリング。遠方国（時差あり）＝オフショアリングです。"
            }
        ];

        // --- STREAMING_CHUNK:Implementing option shuffle and logic ---
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function prepareQuestions(baseQuestions) {
            return baseQuestions.map(q => {
                let optionsWithIndex = q.options.map((opt, index) => ({ text: opt, originalIndex: index }));
                // 選択肢の順番をランダムにシャッフル
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }
                // シャッフル後の正解インデックスを特定
                const newAnswerIndex = optionsWithIndex.findIndex(o => o.originalIndex === q.answer);
                return { ...q, options: optionsWithIndex.map(o => o.text), answer: newAnswerIndex };
            });
        }

        let questions = prepareQuestions([...originalQuestions]);
        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        
        let isPlaying = false;
        let utterance = new SpeechSynthesisUtterance();
        utterance.lang = 'ja-JP';

        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const expBox = document.getElementById('explanation-box');
        const expContent = document.getElementById('explanation-content');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const progText = document.getElementById('progress-text');
        const progBar = document.getElementById('progress-bar');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const qBadge = document.getElementById('question-badge');
        
        const playBtn = document.getElementById('play-audio-btn');
        const stopBtn = document.getElementById('stop-audio-btn');
        const audioStatus = document.getElementById('audio-status');
        const questionSelector = document.getElementById('question-selector');
        
        const shuffleBtn = document.getElementById('shuffle-btn');
        const resultShuffleBtn = document.getElementById('result-shuffle-btn');
        const shuffleModal = document.getElementById('shuffle-modal');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');
        const modalConfirmBtn = document.getElementById('modal-confirm-btn');

        function resetAndRestart(isShuffle = false) {
            if (isPlaying) stopAudio();
            
            let baseQuestions = [...originalQuestions];
            if (isShuffle) {
                baseQuestions = shuffleArray(baseQuestions);
            }
            questions = prepareQuestions(baseQuestions);
            
            currentQuestion = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            
            questionSelector.innerHTML = '';
            questions.forEach((_, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.text = `問 ${index + 1}`;
                questionSelector.appendChild(option);
            });
            
            quizContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            
            loadQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        shuffleBtn.onclick = () => {
            shuffleModal.classList.remove('hidden');
        };

        modalCancelBtn.onclick = () => {
            shuffleModal.classList.add('hidden');
        };

        modalConfirmBtn.onclick = () => {
            shuffleModal.classList.add('hidden');
            resetAndRestart(true); 
        };
        
        resultShuffleBtn.onclick = () => {
            resetAndRestart(true); 
        };

        questions.forEach((_, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.text = `問 ${index + 1}`;
            questionSelector.appendChild(option);
        });

        questionSelector.addEventListener('change', (e) => {
            if (isPlaying) stopAudio();
            currentQuestion = parseInt(e.target.value, 10);
            loadQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function loadQuestion() {
            if (questions.length === 0) return;

            const q = questions[currentQuestion];
            qBadge.innerText = `問 ${currentQuestion + 1} / ${questions.length}`;
            qText.innerHTML = q.question.replace(/\n/g, '<br>');
            
            progText.innerText = `${currentQuestion + 1} / ${questions.length}`;
            progBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            questionSelector.value = currentQuestion;

            if (currentQuestion === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            if (userAnswers[currentQuestion] !== null) {
                showAnswerState(userAnswers[currentQuestion]);
            } else {
                optionsContainer.innerHTML = '';
                expBox.classList.add('hidden');
                nextBtn.classList.add('hidden'); 

                q.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-400 focus:outline-none transition-all duration-150 bg-white font-medium text-slate-700 shadow-sm hover:bg-slate-50 flex items-start gap-3';
                    btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                    btn.onclick = () => {
                        if (isPlaying) stopAudio();
                        selectOption(index);
                    };
                    optionsContainer.appendChild(btn);
                });
            }
        }

        // --- STREAMING_CHUNK:Finalizing logic and event listeners... ---
        function selectOption(selectedIndex) {
            userAnswers[currentQuestion] = selectedIndex;
            if (selectedIndex === questions[currentQuestion].answer) {
                score++;
            }
            showAnswerState(selectedIndex);
        }

        function showAnswerState(selectedIndex) {
            const q = questions[currentQuestion];
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 transition-all duration-150 font-medium flex items-start gap-3';
                btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.disabled = true; 
                
                if (index === q.answer) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-200');
                } else if (index === selectedIndex && index !== q.answer) {
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                } else {
                    btn.classList.add('border-slate-200', 'text-slate-700', 'opacity-60');
                }
                optionsContainer.appendChild(btn);
            });

            expContent.innerHTML = `
                <div class="bg-indigo-50/80 p-3 rounded-lg border border-indigo-100 text-indigo-900 text-xs font-medium">
                    <span class="font-bold">📘 対象シラバス：</span> ${q.syllabus}
                </div>
                <div>
                    <h4 class="font-bold text-slate-900 text-sm mb-1">【正解の根拠と背景】</h4>
                    <p>${q.rationale}</p>
                </div>
                <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 text-amber-900 text-xs">
                    <span class="font-bold text-amber-800">💡 試験対策・着眼点：</span> ${q.tips}
                </div>
            `;
            expBox.classList.remove('hidden');
            
            nextBtn.classList.remove('hidden');
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "結果を見る";
            } else {
                nextBtn.innerText = "次の問題へ進む";
            }

            if(!isPlaying) {
                setTimeout(() => {
                    expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 80);
            }
        }

        nextBtn.onclick = () => {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                quizContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                document.getElementById('score').innerText = score;
                document.getElementById('total-score').innerText = `/ ${questions.length}`;
            }
        };

        prevBtn.onclick = () => {
            if (currentQuestion > 0) {
                if (isPlaying) stopAudio();
                currentQuestion--;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        playBtn.onclick = () => {
            if (isPlaying) return;
            isPlaying = true;
            playBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            audioStatus.classList.remove('hidden');
            
            if (userAnswers[currentQuestion] === null) {
                 selectOption(questions[currentQuestion].answer); 
            }
            readCurrentQuestion();
        };

        stopBtn.onclick = stopAudio;

        function stopAudio() {
            isPlaying = false;
            window.speechSynthesis.cancel();
            stopBtn.classList.add('hidden');
            playBtn.classList.remove('hidden');
            audioStatus.classList.add('hidden');
        }

        function readCurrentQuestion() {
            if (!isPlaying) return;
            
            window.speechSynthesis.cancel();
            const q = questions[currentQuestion];
            
            let textToRead = `第${currentQuestion + 1}問。問題。。。${q.question}。。。。`;
            textToRead += `正解は。。。${q.options[q.answer].replace(/\(.*?\)/g, '')}。。。。`; 
            textToRead += `解説。。。${q.rationale}。。。。`;
            textToRead += `試験対策のポイント。。。${q.tips}`;
            
            utterance.text = textToRead;
            
            utterance.onend = () => {
                if (isPlaying) {
                    if (currentQuestion < questions.length - 1) {
                        currentQuestion++;
                        loadQuestion();
                        if (userAnswers[currentQuestion] === null) {
                             selectOption(questions[currentQuestion].answer); 
                        }
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(readCurrentQuestion, 1500); 
                    } else {
                        stopAudio();
                        alert("すべての問題の読み上げが完了しました。お疲れ様でした！");
                    }
                }
            };
            
            utterance.onerror = (e) => {
                console.error("音声読み上げエラー", e);
                if(isPlaying) stopAudio();
            };
            
            window.speechSynthesis.speak(utterance);
        }

        loadQuestion();
    </script>
</body>
</html>
