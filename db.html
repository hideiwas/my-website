<style>
  .expand-btn {
    cursor: pointer;
    background: #edf2f7;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .detail-row {
    display: none; /* 初期状態では隠す */
    background-color: #f7fafc;
  }
  .json-list {
    margin: 0;
    padding-left: 20px;
    font-size: 14px;
  }
</style>

<table border="1" cellpadding="8" style="border-collapse: collapse; width: 100%;">
  <tr>
    <th>ユーザー名</th>
    <th>最終ログイン</th>
    <th>操作ログ（JSON配列）</th>
  </tr>
  <!-- メインの行 -->
  <tr>
    <td>鈴木一郎</td>
    <td>2026-09-02</td>
    <td>
      <button class="expand-btn" onclick="toggleRow('detail-1', this)">▼ ログ詳細を開く</button>
    </td>
  </tr>
  <!-- 展開される詳細行（最初は非表示） -->
  <tr class="detail-row" id="detail-1">
    <td colspan="3"> <!-- colspanで列を結合して横幅を確保 -->
      <ul class="json-list">
        <li><strong>2026-09-01:</strong> ログイン</li>
        <li><strong>2026-09-02:</strong> 設定変更</li>
        <li><strong>2026-09-02:</strong> パスワード再発行</li>
      </ul>
    </td>
  </tr>
</table>

<script>
  function toggleRow(rowId, btnElement) {
    const row = document.getElementById(rowId);
    if (row.style.display === 'none' || row.style.display === '') {
      row.style.display = 'table-row';
      btnElement.innerText = '▲ 閉じる';
    } else {
      row.style.display = 'none';
      btnElement.innerText = '▼ ログ詳細を開く';
    }
  }
</script>
