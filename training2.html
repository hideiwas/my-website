<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIL 4 CDS 模擬試験 : 研修２ (完全版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-3 md:p-6">

    <!-- シャッフル確認モーダル -->
    <div id="shuffle-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden slide-up">
            <div class="bg-amber-500 p-4 text-center">
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mx-auto text-amber-500 text-2xl font-bold mb-2">🔀</div>
                <h3 class="text-white text-lg font-bold">ランダム出題を開始しますか？</h3>
            </div>
            <div class="p-6">
                <p class="text-slate-600 text-sm mb-6 text-center leading-relaxed">
                    現在の解答状況やスコアは<span class="font-bold text-rose-500">すべてリセット</span>され、第1問から新しい順番で再スタートします。
                </p>
                <div class="flex gap-3">
                    <button id="cancel-shuffle-btn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl transition">キャンセル</button>
                    <button id="confirm-shuffle-btn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition shadow-lg shadow-amber-500/30">シャッフル開始</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="bg-white rounded-2xl shadow-xl w-full max-w-4xl overflow-hidden border border-slate-200 flex flex-col">
        <!-- Header -->
        <div class="bg-indigo-700 text-white px-6 py-5 flex flex-col md:flex-row justify-between items-start md:items-center shadow-md gap-4">
            <div>
                <span class="text-xs font-semibold tracking-wider uppercase text-indigo-200 block">ITIL 4 Specialist</span>
                <h1 class="text-lg md:text-xl font-bold">CDS 模擬試験 : 研修２</h1>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div class="flex items-center gap-2 bg-indigo-800/80 px-3 py-1.5 rounded-lg border border-indigo-400/30">
                    <span class="text-xs text-indigo-300 font-medium">ジャンプ:</span>
                    <select id="question-jump" class="bg-transparent text-white text-sm font-bold focus:outline-none cursor-pointer">
                        <!-- Options will be generated -->
                    </select>
                </div>
                <span id="progress-text" class="text-sm font-semibold bg-indigo-800/80 px-3 py-1.5 rounded-lg border border-indigo-400/30 whitespace-nowrap"></span>
                <button id="shuffle-btn" class="flex-1 md:flex-none bg-amber-500 hover:bg-amber-400 text-white text-sm font-bold py-1.5 px-3 rounded-lg shadow transition flex items-center justify-center gap-1 border border-amber-400">
                    <span>🔀 ランダム</span>
                </button>
                <button id="play-audio-btn" class="flex-1 md:flex-none bg-emerald-500 hover:bg-emerald-400 text-white text-sm font-bold py-1.5 px-3 rounded-lg shadow transition flex items-center justify-center gap-1 border border-emerald-400">
                    <span>▶️ 音声学習</span>
                </button>
                <button id="stop-audio-btn" class="hidden flex-1 md:flex-none bg-rose-500 hover:bg-rose-400 text-white text-sm font-bold py-1.5 px-3 rounded-lg shadow transition flex items-center justify-center gap-1 border border-rose-400">
                    <span>⏹️ 停止</span>
                </button>
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress-bar" class="bg-emerald-500 h-2 transition-all duration-300"></div>
        </div>

        <!-- 音声再生中のステータス表示 -->
        <div id="audio-status" class="hidden bg-emerald-50 text-emerald-800 text-sm font-bold px-4 py-2 border-b border-emerald-200 text-center animate-pulse">
            🔊 現在、自動音声読み上げモードで再生中です...
        </div>

        <!-- Question Area -->
        <div id="quiz-container" class="p-6 md:p-8 flex-1">
            <div class="flex items-center gap-2 mb-3">
                <span id="question-badge" class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded">問題</span>
            </div>
            <h2 id="question-text" class="text-base md:text-lg font-semibold mb-6 leading-relaxed text-slate-900"></h2>
            
            <div id="options-container" class="space-y-3">
                <!-- Options will be injected here -->
            </div>

            <!-- Enhanced Explanation Area -->
            <div id="explanation-box" class="hidden mt-8 p-5 md:p-6 bg-slate-50 border-l-4 border-indigo-600 rounded-r-xl border border-slate-200 slide-up shadow-sm">
                <div class="flex items-center gap-2 mb-3">
                    <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-0.5 rounded">シラバス準拠 解説</span>
                </div>
                <div id="explanation-content" class="text-sm leading-relaxed text-slate-700 space-y-3">
                    <!-- Dynamic explanation blocks -->
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="mt-8 pt-5 border-t border-slate-200 flex flex-col-reverse sm:flex-row justify-between items-center gap-4">
                <button id="prev-btn" class="hidden text-slate-500 hover:text-indigo-600 font-bold py-2 px-4 rounded transition flex items-center gap-2">
                    <span class="text-xl leading-none">&larr;</span> 前の問題に戻る
                </button>
                <button id="next-btn" class="hidden w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-2.5 px-8 rounded-lg shadow transition duration-150 ml-auto">
                    次の問題へ進む
                </button>
            </div>
        </div>
        
        <!-- Result Screen -->
        <div id="result-container" class="hidden p-8 md:p-12 text-center my-auto">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">✓</div>
            <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-2">演習完了</h2>
            <p class="text-slate-600 mb-6">すべての問題の回答と解説の確認が完了しました。</p>
            <div class="bg-slate-50 p-6 rounded-xl max-w-xs mx-auto border border-slate-200 mb-8">
                <div class="text-xs text-slate-500 font-medium uppercase tracking-wider mb-1">正答率</div>
                <div class="text-4xl font-extrabold text-indigo-600"><span id="score"></span> <span id="total-score" class="text-xl text-slate-400 font-normal"></span></div>
            </div>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="location.reload()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition text-sm">最初からやり直す</button>
                <button id="result-shuffle-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition text-sm flex items-center justify-center gap-2">
                    🔀 ランダム順で再挑戦
                </button>
            </div>
        </div>
    </div>

            {

                answer: 2,
                syllabus: "LO3 サービス統合と管理",
                rationale: "外部の独立したインテグレータに任せるのではなく、顧客組織自身が内部に統合の役割（内部SIAM / Retained SIAM）を持つ構造です。",
                tips: "顧客組織自身が統合機能（インテグレータ）の役割を内部で担う構造は「内部サービス・インテグレータ（Retained/Internal SIAM）」と呼ばれます。"

        let questions = [...originalQuestions];
        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let shuffledOptionIndices = [];
        
        let isPlaying = false;
        let utterance = new SpeechSynthesisUtterance();
        utterance.lang = 'ja-JP';

        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const expBox = document.getElementById('explanation-box');
        const expContent = document.getElementById('explanation-content');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const progText = document.getElementById('progress-text');
        const progBar = document.getElementById('progress-bar');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const qBadge = document.getElementById('question-badge');
        
        const playBtn = document.getElementById('play-audio-btn');
        const stopBtn = document.getElementById('stop-audio-btn');
        const audioStatus = document.getElementById('audio-status');
        const jumpSelect = document.getElementById('question-jump');
        
        const shuffleBtn = document.getElementById('shuffle-btn');
        const shuffleModal = document.getElementById('shuffle-modal');
        const cancelShuffleBtn = document.getElementById('cancel-shuffle-btn');
        const confirmShuffleBtn = document.getElementById('confirm-shuffle-btn');
        const resultShuffleBtn = document.getElementById('result-shuffle-btn');

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareQuestions() {
            shuffledOptionIndices = [];
            for(let i=0; i<questions.length; i++) {
                const indices = [0, 1, 2, 3];
                const shuffled = shuffleArray(indices);
                shuffledOptionIndices.push(shuffled);
            }
        }

        function initJumpMenu() {
            jumpSelect.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.text = `問 ${i + 1}`;
                option.className = 'text-slate-800';
                jumpSelect.appendChild(option);
            }
            jumpSelect.addEventListener('change', (e) => {
                if (isPlaying) stopAudio();
                currentQuestion = parseInt(e.target.value);
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            qBadge.innerText = `問 ${currentQuestion + 1} / ${questions.length}`;
            qText.innerHTML = q.question.replace(/\n/g, '<br>');
            
            progText.innerText = `${currentQuestion + 1} / ${questions.length}`;
            progBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            jumpSelect.value = currentQuestion;

            if (currentQuestion === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            if (userAnswers[currentQuestion] !== null) {
                showAnswerState(userAnswers[currentQuestion]);
            } else {
                optionsContainer.innerHTML = '';
                expBox.classList.add('hidden');
                nextBtn.classList.add('hidden'); 

                const currentShuffledIndices = shuffledOptionIndices[currentQuestion];

                currentShuffledIndices.forEach((originalIndex, displayIndex) => {
                    const opt = q.options[originalIndex];
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-400 focus:outline-none transition-all duration-150 bg-white font-medium text-slate-700 shadow-sm hover:bg-slate-50 flex items-start gap-3';
                    btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + displayIndex)}</span> <span>${opt}</span>`;
                    btn.onclick = () => {
                        if (isPlaying) stopAudio();
                        selectOption(originalIndex, btn);
                    };
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function selectOption(originalIndex) {
            userAnswers[currentQuestion] = originalIndex;
            if (originalIndex === questions[currentQuestion].answer) {
                score++;
            }
            showAnswerState(originalIndex);
        }

        function showAnswerState(selectedIndex) {
            const q = questions[currentQuestion];
            optionsContainer.innerHTML = '';
            
            const currentShuffledIndices = shuffledOptionIndices[currentQuestion];

            currentShuffledIndices.forEach((originalIndex, displayIndex) => {
                const opt = q.options[originalIndex];
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 transition-all duration-150 font-medium flex items-start gap-3';
                btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + displayIndex)}</span> <span>${opt}</span>`;
                btn.disabled = true; 
                
                if (originalIndex === q.answer) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-200');
                } else if (originalIndex === selectedIndex && originalIndex !== q.answer) {
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                } else {
                    btn.classList.add('border-slate-200', 'text-slate-700', 'opacity-60');
                }
                optionsContainer.appendChild(btn);
            });

            expContent.innerHTML = `
                <div class="bg-indigo-50/80 p-3 rounded-lg border border-indigo-100 text-indigo-900 text-xs font-medium">
                    <span class="font-bold">📘 対象シラバス：</span> ${q.syllabus}
                </div>
                <div>
                    <h4 class="font-bold text-slate-900 text-sm mb-1">【正解の根拠と背景】</h4>
                    <p>${q.rationale}</p>
                </div>
                <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 text-amber-900 text-xs">
                    <span class="font-bold text-amber-800">💡 試験対策・着眼点：</span> ${q.tips}
                </div>
            `;
            expBox.classList.remove('hidden');
            
            nextBtn.classList.remove('hidden');
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "結果を見る";
            } else {
                nextBtn.innerText = "次の問題へ進む";
            }

            if(!isPlaying) {
                setTimeout(() => {
                    expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 80);
            }
        }

        nextBtn.onclick = () => {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                quizContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                document.getElementById('score').innerText = score;
                document.getElementById('total-score').innerText = `/ ${questions.length}`;
            }
        };

        prevBtn.onclick = () => {
            if (currentQuestion > 0) {
                if (isPlaying) stopAudio();
                currentQuestion--;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        // 音声自動再生
        playBtn.onclick = () => {
            if (isPlaying) return;
            isPlaying = true;
            playBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            audioStatus.classList.remove('hidden');
            
            if (userAnswers[currentQuestion] === null) {
                 selectOption(questions[currentQuestion].answer); 
            }
            readCurrentQuestion();
        };

        stopBtn.onclick = stopAudio;

        function stopAudio() {
            isPlaying = false;
            window.speechSynthesis.cancel();
            stopBtn.classList.add('hidden');
            playBtn.classList.remove('hidden');
            audioStatus.classList.add('hidden');
        }

        function readCurrentQuestion() {
            if (!isPlaying) return;
            window.speechSynthesis.cancel();
            const q = questions[currentQuestion];
            let textToRead = `第${currentQuestion + 1}問。問題。。。${q.question}。。。。`;
            textToRead += `正解は。。。${q.options[q.answer].replace(/\(.*?\)/g, '')}。。。。`;
            textToRead += `解説。。。${q.rationale}。。。。`;
            textToRead += `試験対策のポイント。。。${q.tips}`;
            
            utterance.text = textToRead;
            
            utterance.onend = () => {
                if (isPlaying) {
                    if (currentQuestion < questions.length - 1) {
                        currentQuestion++;
                        loadQuestion();
                        if (userAnswers[currentQuestion] === null) {
                             selectOption(questions[currentQuestion].answer); 
                        }
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(readCurrentQuestion, 1500); 
                    } else {
                        stopAudio();
                        alert("すべての問題の読み上げが完了しました。お疲れ様でした！");
                    }
                }
            };
            
            utterance.onerror = (e) => {
                console.error("音声読み上げエラー", e);
                if(isPlaying) stopAudio();
            };
            
            window.speechSynthesis.speak(utterance);
        }

        // シャッフル機能
        shuffleBtn.onclick = () => {
            if (isPlaying) stopAudio();
            shuffleModal.classList.remove('hidden');
        };
        
        cancelShuffleBtn.onclick = () => {
            shuffleModal.classList.add('hidden');
        };

        function executeShuffle() {
            questions = shuffleArray([...originalQuestions]);
            currentQuestion = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            
            prepareQuestions();
            initJumpMenu();
            loadQuestion();
            
            shuffleModal.classList.add('hidden');
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        confirmShuffleBtn.onclick = executeShuffle;
        resultShuffleBtn.onclick = executeShuffle;

        // 初期化処理
        prepareQuestions();
        initJumpMenu();
        loadQuestion();
    </script>
</body>
