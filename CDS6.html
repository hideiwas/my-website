                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-400 focus:outline-none transition-all duration-150 bg-white font-medium text-slate-700 shadow-sm hover:bg-slate-50 flex items-start gap-3';
                btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            const q = questions[currentQuestion];
            const buttons = optionsContainer.querySelectorAll('button');
            
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:border-indigo-400', 'hover:bg-slate-50', 'cursor-pointer');
                b.classList.add('opacity-75');
            });

            if (selectedIndex === q.answer) {
                btnElement.classList.remove('border-slate-200', 'opacity-75');
                btnElement.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'opacity-100', 'ring-2', 'ring-emerald-200');
                score++;
            } else {
                btnElement.classList.remove('border-slate-200', 'opacity-75');
                btnElement.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900', 'opacity-100');
                
                // 正解をハイライト
                buttons[q.answer].classList.remove('border-slate-200', 'opacity-75');
                buttons[q.answer].classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'opacity-100', 'ring-2', 'ring-emerald-200');
            }

            // 解説をシラバス構造でリッチに描画
            expContent.innerHTML = `
                <div class="bg-indigo-50/80 p-3 rounded-lg border border-indigo-100 text-indigo-900 text-xs font-medium">
                    <span class="font-bold">📘 対象シラバス：</span> ${q.syllabus}
                </div>
                <div>
                    <h4 class="font-bold text-slate-900 text-sm mb-1">【正解の根拠と背景】</h4>
                    <p>${q.rationale}</p>
                </div>
                <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 text-amber-900 text-xs">
                    <span class="font-bold text-amber-800">💡 試験対策・着眼点：</span> ${q.tips}
                </div>
            `;
            expBox.classList.remove('hidden');
            
            setTimeout(() => {
                expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 80);
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                quizContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                document.getElementById('score').innerText = score;
            }
        };

        // 初期化
        loadQuestion();
    </script>
</body>
</html>
