                question: "インシデント管理におけるサードパーティの役割に関する記述として、正しいものはどれですか？",
                options: [
                    "インシデント管理中のサードパーティとのやり取りは、可能な限り形式化（フォーマル化）すべきである",
                    "インシデントモデルは、インシデント管理へのサードパーティの関与を定義すべきである",
                    "サードパーティはインシデント管理の活動から除外すべきである",
                    "インシデント管理の活動は、可能な限りサードパーティに委任すべきである"
                ],
                answer: 1,
                syllabus: "1. インシデント管理 (INM: 6)",
                rationale: "インシデントモデルは、サードパーティがインシデント解決にどのように関与するか、および組織がどのように効果的なコラボレーションを確保するかを定義すべきです。",
                tips: "サードパーティが関与するインシデントの手順や連携方法は「インシデントモデル」の中に定義しておきます。"
            }
        ];

        let questions = [...originalQuestions];
        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let shuffledOptionIndices = [];
        
        let isPlaying = false;
        let utterance = new SpeechSynthesisUtterance();
        utterance.lang = 'ja-JP';

        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const expBox = document.getElementById('explanation-box');
        const expContent = document.getElementById('explanation-content');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const progText = document.getElementById('progress-text');
        const progBar = document.getElementById('progress-bar');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const qBadge = document.getElementById('question-badge');
        
        const playBtn = document.getElementById('play-audio-btn');
        const stopBtn = document.getElementById('stop-audio-btn');
        const audioStatus = document.getElementById('audio-status');
        const jumpSelect = document.getElementById('question-jump');
        
        const shuffleBtn = document.getElementById('shuffle-btn');
        const shuffleModal = document.getElementById('shuffle-modal');
        const cancelShuffleBtn = document.getElementById('cancel-shuffle-btn');
        const confirmShuffleBtn = document.getElementById('confirm-shuffle-btn');
        const resultShuffleBtn = document.getElementById('result-shuffle-btn');

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareQuestions() {
            shuffledOptionIndices = [];
            for(let i=0; i<questions.length; i++) {
                const indices = [0, 1, 2, 3];
                const shuffled = shuffleArray(indices);
                shuffledOptionIndices.push(shuffled);
            }
        }

        function initJumpMenu() {
            jumpSelect.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.text = `問 ${i + 1}`;
                option.className = 'text-slate-800';
                jumpSelect.appendChild(option);
            }
            jumpSelect.addEventListener('change', (e) => {
                if (isPlaying) stopAudio();
                currentQuestion = parseInt(e.target.value);
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            qBadge.innerText = `問 ${currentQuestion + 1} / ${questions.length}`;
            qText.innerHTML = q.question.replace(/\n/g, '<br>');
            
            progText.innerText = `${currentQuestion + 1} / ${questions.length}`;
            progBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            jumpSelect.value = currentQuestion;

            if (currentQuestion === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            if (userAnswers[currentQuestion] !== null) {
                showAnswerState(userAnswers[currentQuestion]);
            } else {
                optionsContainer.innerHTML = '';
                expBox.classList.add('hidden');
                nextBtn.classList.add('hidden'); 

                const currentShuffledIndices = shuffledOptionIndices[currentQuestion];

                currentShuffledIndices.forEach((originalIndex, displayIndex) => {
                    const opt = q.options[originalIndex];
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-teal-400 focus:outline-none transition-all duration-150 bg-white font-medium text-slate-700 shadow-sm hover:bg-slate-50 flex items-start gap-3';
                    btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + displayIndex)}</span> <span>${opt}</span>`;
                    btn.onclick = () => {
                        if (isPlaying) stopAudio();
                        selectOption(originalIndex, btn);
                    };
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function selectOption(originalIndex) {
            userAnswers[currentQuestion] = originalIndex;
            if (originalIndex === questions[currentQuestion].answer) {
                score++;
            }
            showAnswerState(originalIndex);
        }

        function showAnswerState(selectedIndex) {
            const q = questions[currentQuestion];
            optionsContainer.innerHTML = '';
            
            const currentShuffledIndices = shuffledOptionIndices[currentQuestion];

            currentShuffledIndices.forEach((originalIndex, displayIndex) => {
                const opt = q.options[originalIndex];
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 transition-all duration-150 font-medium flex items-start gap-3';
                btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold shrink-0 mt-0.5">${String.fromCharCode(65 + displayIndex)}</span> <span>${opt}</span>`;
                btn.disabled = true; 
                
                if (originalIndex === q.answer) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emerald-200');
                } else if (originalIndex === selectedIndex && originalIndex !== q.answer) {
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                } else {
                    btn.classList.add('border-slate-200', 'text-slate-700', 'opacity-60');
                }
                optionsContainer.appendChild(btn);
            });

            expContent.innerHTML = `
                <div class="bg-teal-50/80 p-3 rounded-lg border border-teal-100 text-teal-900 text-xs font-medium">
                    <span class="font-bold">📘 対象シラバス：</span> ${q.syllabus}
                </div>
                <div>
                    <h4 class="font-bold text-slate-900 text-sm mb-1">【正解の根拠と背景】</h4>
                    <p>${q.rationale}</p>
                </div>
                <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 text-amber-900 text-xs">
                    <span class="font-bold text-amber-800">💡 試験対策・着眼点：</span> ${q.tips}
                </div>
            `;
            expBox.classList.remove('hidden');
            
            nextBtn.classList.remove('hidden');
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerText = "結果を見る";
            } else {
                nextBtn.innerText = "次の問題へ進む";
            }

            if(!isPlaying) {
                setTimeout(() => {
                    expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 80);
            }
        }

        nextBtn.onclick = () => {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                quizContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                document.getElementById('score').innerText = score;
                document.getElementById('total-score').innerText = `/ ${questions.length}`;
            }
        };

        prevBtn.onclick = () => {
            if (currentQuestion > 0) {
                if (isPlaying) stopAudio();
                currentQuestion--;
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        // 音声自動再生
        playBtn.onclick = () => {
            if (isPlaying) return;
            isPlaying = true;
            playBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            audioStatus.classList.remove('hidden');
            
            if (userAnswers[currentQuestion] === null) {
                 selectOption(questions[currentQuestion].answer); 
            }
            readCurrentQuestion();
        };

        stopBtn.onclick = stopAudio;

        function stopAudio() {
            isPlaying = false;
            window.speechSynthesis.cancel();
            stopBtn.classList.add('hidden');
            playBtn.classList.remove('hidden');
            audioStatus.classList.add('hidden');
        }

        function readCurrentQuestion() {
            if (!isPlaying) return;
            window.speechSynthesis.cancel();
            const q = questions[currentQuestion];
            let textToRead = `第${currentQuestion + 1}問。問題。。。${q.question}。。。。`;
            textToRead += `正解は。。。${q.options[q.answer]}。。。。`;
            textToRead += `解説。。。${q.rationale}。。。。`;
            textToRead += `試験対策のポイント。。。${q.tips}`;
            
            utterance.text = textToRead;
            
            utterance.onend = () => {
                if (isPlaying) {
                    if (currentQuestion < questions.length - 1) {
                        currentQuestion++;
                        loadQuestion();
                        if (userAnswers[currentQuestion] === null) {
                             selectOption(questions[currentQuestion].answer); 
                        }
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(readCurrentQuestion, 1500); 
                    } else {
                        stopAudio();
                        alert("すべての問題の読み上げが完了しました。お疲れ様でした！");
                    }
                }
            };
            
            utterance.onerror = (e) => {
                console.error("音声読み上げエラー", e);
                if(isPlaying) stopAudio();
            };
            
            window.speechSynthesis.speak(utterance);
        }

        // シャッフル機能
        shuffleBtn.onclick = () => {
            if (isPlaying) stopAudio();
            shuffleModal.classList.remove('hidden');
        };
        
        cancelShuffleBtn.onclick = () => {
            shuffleModal.classList.add('hidden');
        };

        function executeShuffle() {
            questions = shuffleArray([...originalQuestions]);
            currentQuestion = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            
            prepareQuestions();
            initJumpMenu();
            loadQuestion();
            
            shuffleModal.classList.add('hidden');
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        confirmShuffleBtn.onclick = executeShuffle;
        resultShuffleBtn.onclick = executeShuffle;

        // 初期化処理
        prepareQuestions();
        initJumpMenu();
        loadQuestion();
    </script>
</body>
</html>
